<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="ds/styles.css">
<link rel="stylesheet" href="ds/proto.css">
</helmet>
<div style="display:flex;flex-direction:column;height:100%;min-height:0;background:var(--surface)">
  <div ref="{{ bodyRef }}" style="flex:1;overflow-y:auto;padding:4px 16px 20px;min-height:0">
    <sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
      <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ true }}">
        <div class="msg-u fadein">
          <sc-if value="{{ m.isFile }}" hint-placeholder-val="{{ false }}">
            <span class="tag" style="margin-right:7px;background:rgba(255,255,255,.22);color:#fff">File</span>
          </sc-if>{{ m.text }}
        </div>
      </sc-if>
      <sc-if value="{{ m.isAssistant }}" hint-placeholder-val="{{ true }}">
        <div class="fadein" style="margin:12px 0">
          <sc-if value="{{ m.hasTools }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px">
              <sc-for list="{{ m.tools }}" as="t" hint-placeholder-count="1">
                <span class="toolchip">{{ t.label }}</span>
              </sc-for>
            </div>
          </sc-if>
          <div class="msg-a" style="margin:0">{{ m.text }}</div>
          <sc-if value="{{ m.hasLinks }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
              <sc-for list="{{ m.links }}" as="l" hint-placeholder-count="2">
                <button class="qlink" onClick="{{ l.onClick }}">
                  <span class="dot {{ l.dotCls }}" style="width:7px;height:7px"></span>
                  <span style="min-width:0">{{ l.label }}</span>
                  <span style="margin-left:auto;color:var(--ink-3);font-weight:400">→</span>
                </button>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ m.hasAfter }}" hint-placeholder-val="{{ false }}">
            <div class="msg-a" style="margin:10px 0 0">{{ m.after }}</div>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ m.isProposal }}" hint-placeholder-val="{{ false }}">
        <div class="prop fadein">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span class="microcap" style="color:var(--brand)">Proposed updates</span>
            <span style="font-size:11.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">from {{ m.source }}</span>
          </div>
          <div style="font-size:12.5px;color:var(--ink-2);margin:4px 0 9px">Nothing is written until you apply. Each apply is attributed to you.</div>
          <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="3">
            <div class="prop-item {{ it.rowCls }}">
              <div style="min-width:0">
                <div class="e-type {{ it.toneCls }}">{{ it.label }}</div>
                <div style="font-weight:600;font-size:13px;margin-top:2px">{{ it.title }}</div>
                <div style="font-size:12.5px;color:var(--ink-2);margin-top:1px">{{ it.detail }}</div>
                <sc-if value="{{ it.hasState }}" hint-placeholder-val="{{ false }}">
                  <div style="font-size:11.5px;font-weight:600;margin-top:4px;color:var(--ink-3)">{{ it.stateText }}</div>
                </sc-if>
              </div>
              <sc-if value="{{ it.isPending }}" hint-placeholder-val="{{ true }}">
                <div style="display:flex;gap:6px;flex-shrink:0">
                  <button class="btn btn-sm" onClick="{{ it.onApply }}">Apply</button>
                  <button class="btn-2 btn-sm" onClick="{{ it.onDismiss }}">Dismiss</button>
                </div>
              </sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ m.hasPending }}" hint-placeholder-val="{{ true }}">
            <button class="btn-ghost btn-sm" style="margin-top:8px" onClick="{{ m.onApplyAll }}">{{ m.applyAllLabel }}</button>
          </sc-if>
        </div>
      </sc-if>
    </sc-for>
    <sc-if value="{{ hasInflight }}" hint-placeholder-val="{{ false }}">
      <div style="margin:12px 0">
        <sc-if value="{{ inflight.hasTools }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px">
            <sc-for list="{{ inflight.tools }}" as="t" hint-placeholder-count="1">
              <span class="toolchip">{{ t.label }}</span>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:600">
          {{ inflight.label }}<span class="dots"><span>·</span><span>·</span><span>·</span></span>
        </div>
        <sc-if value="{{ inflight.hasText }}" hint-placeholder-val="{{ false }}">
          <div class="msg-a" style="margin:8px 0 0">{{ inflight.text }}<span class="cursor"></span></div>
        </sc-if>
      </div>
    </sc-if>
  </div>
  <div style="flex:none;border-top:1px solid var(--line);padding:11px 16px 9px">
    <sc-if value="{{ hasSuggestions }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px">
        <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3">
          <button class="chip" onClick="{{ s.onClick }}">{{ s.label }}</button>
        </sc-for>
      </div>
    </sc-if>
    <div style="display:flex;gap:7px;align-items:center">
      <button class="btn-2 btn-sm" title="Upload a file" onClick="{{ onAttach }}" style="padding:8px 10px;flex-shrink:0">+ File</button>
      <input class="input" placeholder="{{ placeholder }}" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}">
      <button class="btn btn-sm" onClick="{{ send }}" style="padding:8px 13px;flex-shrink:0">Send</button>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:372,&quot;height&quot;:720},&quot;messages&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Msg[]&quot;},&quot;inflight&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object|null&quot;},&quot;suggestions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,onClick}[]&quot;},&quot;onSend&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t:string)=&gt;void&quot;},&quot;onAttach&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Message your assistant…&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { draft: '' };
  bodyRef = React.createRef();
  scroll() { const el = this.bodyRef.current; if (el) el.scrollTop = el.scrollHeight; }
  componentDidMount() { this.scroll(); }
  componentDidUpdate() { this.scroll(); }
  renderVals() {
    const p = this.props;
    const send = () => {
      const t = this.state.draft.trim();
      if (!t) return;
      this.setState({ draft: '' });
      if (p.onSend) p.onSend(t);
    };
    return {
      messages: p.messages || [],
      inflight: p.inflight || {},
      hasInflight: !!p.inflight,
      suggestions: p.suggestions || [],
      hasSuggestions: !!(p.suggestions && p.suggestions.length),
      draft: this.state.draft,
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === 'Enter') send(); },
      send,
      onAttach: p.onAttach,
      bodyRef: this.bodyRef,
      placeholder: p.placeholder || 'Message your assistant…'
    };
  }
}

</script>
</body>
</html>
