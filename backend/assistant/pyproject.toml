[project]
name = "workbench-assistant"
version = "0.1.0"
description = "CSA Workbench assistant runtime"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol==0.1.13",
    "aiohttp>=3.11.0",
    "azure-identity>=1.25.2",
    "deepagents==0.6.11",
    "fastapi>=0.133.0",
    "httpx>=0.28.0",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-openai==1.3.3",
    "langgraph==1.2.6",
    "langsmith==0.9.1",
    "openai==2.43.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.41.0",
    "workbench-core",
]

[project.optional-dependencies]
tracing = ["workbench-core[tracing]"]
copilot = ["github-copilot-sdk==1.0.1"]

[tool.uv.sources]
workbench-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
