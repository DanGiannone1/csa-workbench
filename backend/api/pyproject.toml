[project]
name = "workbench-api"
version = "0.1.0"
description = "CSA Workbench HTTP API"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",
    "azure-identity>=1.25.2",
    "azure-storage-blob>=12.28.0",
    "fastapi>=0.133.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.41.0",
    "workbench-core",
]

[project.optional-dependencies]
tracing = ["workbench-core[tracing]"]

[tool.uv.sources]
workbench-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
