[project]
name = "csa-workbench"
version = "0.1.0"
description = "Workspace for the CSA Workbench API, assistant, and shared core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "workbench-api",
    "workbench-assistant",
    "workbench-core",
]

[tool.uv]
package = false

[tool.uv.sources]
workbench-api = { workspace = true }
workbench-assistant = { workspace = true }
workbench-core = { workspace = true }

[tool.uv.workspace]
members = ["backend/api", "backend/assistant", "backend/core"]

[dependency-groups]
dev = ["pytest>=9.0.0"]
