# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.41-preview'
name: isolated-web-search-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 10
                name: GlobalStandard
    isolated-web-search-agent:
        project: src/isolated-web-search-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A hosted Foundry agent harness that delegates public-web research to an isolated read-only subagent and admits only validated findings.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: FOUNDRY_OPENAI_BASE_URL
              value: ${FOUNDRY_OPENAI_BASE_URL}
            - name: WEB_RESEARCH_MODE
              value: ${WEB_RESEARCH_MODE}
            - name: WEB_RESEARCH_ALLOWED_DOMAINS
              value: ${WEB_RESEARCH_ALLOWED_DOMAINS}
            - name: WEB_RESEARCH_SUBPROCESS_TIMEOUT_SECONDS
              value: ${WEB_RESEARCH_SUBPROCESS_TIMEOUT_SECONDS}
            - name: WEB_RESEARCH_MAX_ITERATIONS
              value: ${WEB_RESEARCH_MAX_ITERATIONS}
            - name: WEB_RESEARCH_MAX_FETCHES
              value: ${WEB_RESEARCH_MAX_FETCHES}
            - name: WEB_RESEARCH_MAX_FINDINGS_CHARS
              value: ${WEB_RESEARCH_MAX_FINDINGS_CHARS}
            - name: WEB_RESEARCH_HTTP_TIMEOUT_SECONDS
              value: ${WEB_RESEARCH_HTTP_TIMEOUT_SECONDS}
            - name: WEB_RESEARCH_MAX_REDIRECTS
              value: ${WEB_RESEARCH_MAX_REDIRECTS}
            - name: WEB_RESEARCH_MAX_BYTES
              value: ${WEB_RESEARCH_MAX_BYTES}
            - name: WEB_RESEARCH_USER_AGENT
              value: ${WEB_RESEARCH_USER_AGENT}
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Isolated Web Search
                - Responses Protocol
                - Prompt Injection Controls
        name: isolated-web-search-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
